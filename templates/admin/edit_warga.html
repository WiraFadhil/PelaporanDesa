<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Warga - Admin Pelaporan Desa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
  <div class="admin">
    <aside class="admin__sidebar" id="sidebar">
      <div class="admin__sidebar-brand">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1A56DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <div>
          <div class="admin__sidebar-title">Pelaporan Desa</div>
          <span class="admin__sidebar-sub">{{ session.admin_name }}</span>
        </div>
      </div>
      <nav class="admin__nav">
        <a href="../admin/" class="admin__nav-link">Dashboard</a>
        <a href="../admin/reports" class="admin__nav-link">Kelola Laporan</a>
        <a href="../admin/warga" class="admin__nav-link active">Kelola Warga</a>
        <a href="../admin/kategori" class="admin__nav-link">Kategori</a>
        <a href="../admin/pengumuman" class="admin__nav-link">Pengumuman</a>
        <a href="../admin/pengaturan" class="admin__nav-link">Pengaturan</a>
      </nav>
      <div class="admin__sidebar-footer">
        <a href="../admin/logout" class="admin__nav-link">Keluar</a>
      </div>
    </aside>

    <div class="admin__main">
      <header class="admin__header">
        <button class="admin__toggle" id="sidebarToggle" aria-label="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="admin__header-title">
          <h1>Edit Warga</h1>
          <span>{{ resident.nama }}</span>
        </div>
        <div class="admin__header-actions">
          <a href="/" class="admin__header-link" title="Kembali ke Website">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          </a>
        </div>
      </header>

      <div class="admin__content">
        <div class="admin__card" style="max-width:600px;margin:0 auto">
          <div class="admin__card-header">
            <h2 class="admin__card-title">Edit Data Warga: {{ resident.nama }}</h2>
          </div>
          <form method="POST" action="../admin/warga/edit/{{ resident.id }}">
            <div class="admin__settings-grid" style="padding:24px">
              <div class="admin__filter-group">
                <label class="admin__filter-label">NIK</label>
                <input type="text" class="admin__filter-input" name="nik" value="{{ resident.nik }}" required>
              </div>
              <div class="admin__filter-group">
                <label class="admin__filter-label">Nama Lengkap</label>
                <input type="text" class="admin__filter-input" name="nama" value="{{ resident.nama }}" required>
              </div>
              <div class="admin__filter-group" style="grid-column:span 2">
                <label class="admin__filter-label">Alamat</label>
                <input type="text" class="admin__filter-input" name="alamat" value="{{ resident.alamat }}">
              </div>
              <div class="admin__filter-group">
                <label class="admin__filter-label">RT</label>
                <input type="text" class="admin__filter-input" name="rt" value="{{ resident.rt }}">
              </div>
              <div class="admin__filter-group">
                <label class="admin__filter-label">RW</label>
                <input type="text" class="admin__filter-input" name="rw" value="{{ resident.rw }}">
              </div>
              <div class="admin__filter-group">
                <label class="admin__filter-label">Telepon</label>
                <input type="text" class="admin__filter-input" name="telepon" value="{{ resident.telepon }}">
              </div>
              <div class="admin__filter-group">
                <label class="admin__filter-label">Status</label>
                <select name="status" class="admin__filter-select">
                  <option value="Aktif" {% if resident.status == 'Aktif' %}selected{% endif %}>Aktif</option>
                  <option value="Tidak Aktif" {% if resident.status == 'Tidak Aktif' %}selected{% endif %}>Tidak Aktif</option>
                </select>
              </div>
            </div>
            <div class="admin__settings-actions" style="padding:16px 24px">
              <a href="../admin/warga" class="admin__page-btn">Kembali</a>
              <button type="submit" class="admin__submit-btn">Simpan Perubahan</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="../static/js/script.js"></script>
</body>
</html>
