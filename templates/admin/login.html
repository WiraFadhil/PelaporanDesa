<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Pelaporan Desa RT 02 / RW 01</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
  <div class="login">
    <div class="login__card">
      <div class="login__header">
        <div class="login__logo">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1A56DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <h1 class="login__title">Panel Admin</h1>
        <p class="login__subtitle">Pelaporan Desa RT 02 / RW 01</p>
      </div>
      {% if error %}
      <div style="background:#FEF2F2;border:1px solid #FCA5A5;border-radius:8px;padding:10px 14px;margin-bottom:16px;text-align:center;color:#DC2626;font-size:14px">{{ error }}</div>
      {% endif %}
      <form class="login__form" method="POST" action="login">
        <div class="login__group">
          <label class="login__label" for="username">Username</label>
          <div class="login__input-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" class="login__input" id="username" name="username" placeholder="Masukkan username" required>
          </div>
        </div>
        <div class="login__group">
          <label class="login__label" for="password">Password</label>
          <div class="login__input-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" class="login__input" id="password" name="password" placeholder="Masukkan password" required>
          </div>
        </div>
        <button type="submit" class="login__btn">Masuk</button>
      </form>
      <div class="login__footer">
        <a href="../">← Kembali ke Beranda</a>
      </div>
    </div>
  </div>
  <script src="/static/js/script.js"></script>
</body>
</html>
