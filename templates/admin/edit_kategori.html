<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Kategori - Admin Pelaporan Desa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="admin">
    <aside class="admin__sidebar" id="sidebar">
      <div class="admin__sidebar-brand">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1A56DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <div>
          <div class="admin__sidebar-title">Pelaporan Desa</div>
          <span class="admin__sidebar-sub">{{ session.admin_name }}</span>
        </div>
      </div>
      <nav class="admin__nav">
        <a href="/admin/" class="admin__nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Dashboard
        </a>
        <a href="/admin/reports" class="admin__nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Kelola Laporan
        </a>
        <a href="/admin/warga" class="admin__nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Kelola Warga
        </a>
        <a href="/admin/kategori" class="admin__nav-link active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="9" y1="6" x2="15" y2="6"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="13" y2="14"/></svg>
          Kategori
        </a>
        <a href="/admin/pengumuman" class="admin__nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          Pengumuman
        </a>
        <a href="/admin/pengaturan" class="admin__nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
          Pengaturan
        </a>
      </nav>
      <div class="admin__sidebar-footer">
        <a href="/admin/logout" class="admin__nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Keluar
        </a>
      </div>
    </aside>

    <div class="admin__main">
      <header class="admin__header">
        <button class="admin__toggle" id="sidebarToggle" aria-label="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="admin__header-title">
          <h1>Edit Kategori</h1>
          <span>{{ category.nama }}</span>
        </div>
        <div class="admin__header-actions">
          <a href="/" class="admin__header-link" title="Kembali ke Website">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          </a>
          <div class="admin__header-user">
            <img src="https://ui-avatars.com/api/?name=Admin&background=1A56DB&color=fff&size=36" alt="Admin">
          </div>
        </div>
      </header>

      <div class="admin__content">
        <div class="admin__card" style="max-width:560px;margin:0 auto">
          <div class="admin__card-header">
            <h2 class="admin__card-title">Edit Kategori</h2>
          </div>
          <form method="POST" action="/admin/kategori/edit/{{ category.id }}">
            <div class="admin__settings">
              <div class="admin__settings-grid" style="grid-template-columns:1fr">
                <div class="admin__filter-group">
                  <label class="admin__filter-label">Nama Kategori</label>
                  <input type="text" name="nama" class="admin__filter-input" value="{{ category.nama }}" required>
                </div>
                <div class="admin__filter-group">
                  <label class="admin__filter-label">Icon</label>
                  <input type="text" name="icon" class="admin__filter-input" value="{{ category.icon }}" placeholder="Nama icon (misal: building, trash)">
                </div>
                <div class="admin__filter-group">
                  <label class="admin__filter-label">Warna</label>
                  <select name="warna" class="admin__filter-select">
                    <option value="blue" {% if category.warna == 'blue' %}selected{% endif %}>Biru</option>
                    <option value="green" {% if category.warna == 'green' %}selected{% endif %}>Hijau</option>
                    <option value="red" {% if category.warna == 'red' %}selected{% endif %}>Merah</option>
                    <option value="amber" {% if category.warna == 'amber' %}selected{% endif %}>Kuning</option>
                    <option value="purple" {% if category.warna == 'purple' %}selected{% endif %}>Ungu</option>
                    <option value="gray" {% if category.warna == 'gray' %}selected{% endif %}>Abu-abu</option>
                  </select>
                </div>
                <div class="admin__filter-group">
                  <label class="admin__filter-label">Jumlah Laporan</label>
                  <input type="text" class="admin__filter-input" value="{{ category.jumlah_laporan }}" disabled>
                </div>
              </div>
              <div class="admin__settings-actions">
                <a href="/admin/kategori" class="admin__page-btn">Kembali</a>
                <button type="submit" class="admin__submit-btn">Simpan Perubahan</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="/static/js/script.js"></script>
</body>
</html>
