<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Pelaporan Desa RT 02 / RW 01</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
  <div class="login">
    <div class="login__card">
      <div class="login__header">
        <div class="login__logo">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1A56DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <h1 class="login__title">Masuk</h1>
        <p class="login__subtitle">Masuk untuk melacak laporan Anda</p>
      </div>
      {% if error %}
      <div style="background:#FEF2F2;border:1px solid #FCA5A5;border-radius:8px;padding:10px 14px;margin-bottom:16px;text-align:center;color:#DC2626;font-size:14px">{{ error }}</div>
      {% endif %}
      <form class="login__form" method="POST" action="masuk">
        <div class="login__group">
          <label class="login__label" for="nik">NIK</label>
          <div class="login__input-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="12" cy="10" r="3"/><path d="M12 13c-3.31 0-6 1.34-6 3v1h12v-1c0-1.66-2.69-3-6-3z"/></svg>
            <input type="text" class="login__input" id="nik" name="nik" placeholder="Masukkan NIK" required>
          </div>
        </div>
        <div class="login__group">
          <label class="login__label" for="password">Password</label>
          <div class="login__input-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" class="login__input" id="password" name="password" placeholder="Masukkan password" required>
          </div>
        </div>
        <button type="submit" class="login__btn">Masuk</button>
      </form>
      <div class="login__footer">
        <a href="daftar">Belum punya akun? Daftar disini</a>
        <br><br>
        <a href="./">← Kembali ke Beranda</a>
      </div>
    </div>
  </div>
  <script src="/static/js/script.js"></script>
</body>
</html>
